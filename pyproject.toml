[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "fusioncast"
description = "Hybrid weather forecasting toolkit combining meteorological and real-time signals."
readme = "README.md"
authors = [{ name = "FusionCast Maintainers" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "ruff>=0.3.4",
  "mypy>=1.8",
  "httpx>=0.27"
]

[project.urls]
Homepage = "https://github.com/FusionCast/FusionCast"
Repository = "https://github.com/FusionCast/FusionCast"
Issues = "https://github.com/FusionCast/FusionCast/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "W",
  "UP"
]
ignore = ["E203", "E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["fusioncast"]

[tool.ruff.lint.per-file-ignores]
"tests/__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
mypy_path = ["src"]

[tool.hatch.metadata.hooks.requirements]
files = []

[tool.hatch.version]
path = "src/fusioncast/__about__.py"
